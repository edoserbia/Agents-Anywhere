name: Publish DSH Bridge Next

on:
  push:
    tags:
      - dsh-bridge-next-v*

permissions:
  contents: read

concurrency:
  group: dsh-bridge-next-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
  YARN_ENABLE_SCRIPTS: "false"
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  publish:
    name: Verify and publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          python-version: "3.12"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Python integration fixtures
        run: |
          uv sync --project connector
          uv sync --project server

      - name: Install plugin dependencies
        working-directory: dsh-bridge-next
        env:
          YARN_NPM_MINIMAL_AGE_GATE: "0"
        run: corepack yarn install

      - name: Build, inspect and test plugin
        working-directory: dsh-bridge-next
        run: |
          corepack yarn build
          corepack yarn check:build
          corepack yarn test

      - name: Typecheck plugin against DSH RC declarations
        working-directory: dsh-bridge-next
        continue-on-error: true
        run: corepack yarn typecheck

      - name: Match release tag to package version
        working-directory: dsh-bridge-next
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "dsh-bridge-next-v${package_version}"

      - name: Publish with provenance
        working-directory: dsh-bridge-next
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
